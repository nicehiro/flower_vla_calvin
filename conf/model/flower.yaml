# FLOWERVLA Configuration
_target_: flower.models.flower.FLOWERVLA
_recursive_: false

# VLM Configuration
vlm_path: microsoft/Florence-2-large
freeze_florence: False
freeze_vision_tower: False
vlm_prompt_style: default
token_dropout: 0.1  # Added token dropout parameter

# Model Structure
multistep: ${multistep}
num_sampling_steps: 4
lowdim_obs_dim: 7
action_dim: 7
act_window_size: 10

# pretraining stuff
load_pretrained: False
pretrained_model_path: /home/hk-project-sustainebot/ft4740/code/flower_vla_policy/logs/runs/2025-02-05/10-17-02/360000_model_weights.pt
# /home/hk-project-sustainebot/ft4740/code/flower_vla/logs/runs/2025-02-19/11-15-41/200000_model_weights.pt
# /home/hk-project-sustainebot/ft4740/code/flower_vla_policy/logs/runs/2025-02-05/10-17-02/360000_model_weights.pt joint + delta pret
# Model flags
use_second_view: True
second_view_key: image_wrist
action_type_adaln: True
use_causal_attention: true
use_cross_attn: True
use_adaln_cond: false
use_readout_token: false
return_act_chunk: false

# ==============================================================================
# Proprio-Guided VL Token Selection
# Uses proprio history to select the most relevant VL tokens via cross-attention,
# then uses only selected tokens as context for DiT cross-attention (compression)
# ==============================================================================
use_proprio_vl_selection: false    # Enable proprio-guided VL token selection
vl_selection_k: 64                # Top-K VL tokens to keep (out of ~650)
vl_selection_use_residual: true   # Add global mean-pooled token to preserve info
vl_selection_use_temporal_attn: true  # Use temporal self-attention in proprio encoder
vl_selection_per_layer: false     # If True, select per DiT layer (future extension)
# Selection mode options:
#   - proprio_topk: Proprio-guided top-K selection (default)
#   - random: Random K tokens per sample (ablation baseline)
#   - mean_pool: Mean pool all VL tokens to single token
#   - max_pool: Select top-K tokens based on max feature values
#   - soft_topk_ste: Straight-Through Estimator for differentiable selection
#   - soft_topk_gumbel: Gumbel-Softmax for differentiable selection
#   - max_pool_proprio_ctx: Max selection + proprio as separate context tokens [B, K+H+1, D]
#   - proprio_max_hybrid: Hybrid max+proprio scoring + gated proprio injection [B, K+1, D]
vl_selection_mode: "proprio_topk"

# Proprio configuration
proprio_history_len: 5            # Number of history frames (1 = current state only)
proprio_state_dim: 15             # State dimension per frame (CALVIN robot_obs is 15D)
proprio_dropout: 0.0              # Dropout probability in proprio encoder

# ==============================================================================
# Pre-VLM Vision Token Selection (LightVLA-style)
# Selects vision patches BEFORE VLM encoder using text-tokenized proprio.
# Uses binary gating: tokens selected by any query are kept, others zeroed.
# ==============================================================================
use_pre_vlm_selection: true
pre_vlm_use_residual: true
pre_vlm_num_bins: 256
pre_vlm_min_value: -3.0
pre_vlm_max_value: 3.0
pre_vlm_noise_start: 1.0
pre_vlm_noise_end: 0.01

# DiT Configuration
sampling_type: uniform
dit_dim: 1024
n_heads: 16
n_layers: 18
attn_pdrop: 0.1
resid_pdrop: 0.1
mlp_pdrop: 0.1

# RoPE Configuration
use_rope: true
use_nope: false
query_seq_len: 100
rope_theta: 32.0

# Optimizer Configuration
optimizer_type: adamw

optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05
  learning_rate: 2e-5
  betas: [0.9, 0.95]

# Learning Rate Scheduler
lr_scheduler:
  lr_scheduler:
    init_lr: 2e-5
    init_lr_scale: 0.1
    final_lr_scale: 0.5
    total_steps: 50000
    phase_ratio: "(0.05, 0.1, 0.85)"
    lr: 2e-5
